name: Custom Regression Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - custom_components/choreops/**/*.py
      - tests/test_chore_crud_services.py
      - tests/test_dashboard_recent_adjustments.py
      - tests/test_economy_catalog_crud_services.py
      - .github/workflows/custom-regression-validation.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custom-regressions:
    name: Run custom fork regressions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-homeassistant-custom-component
          pip install types-python-dateutil types-PyYAML

      - name: Run fork regression tests
        run: |
          python -m pytest \
            tests/test_chore_crud_services.py \
            tests/test_dashboard_recent_adjustments.py \
            tests/test_economy_catalog_crud_services.py \
            -v --tb=line
